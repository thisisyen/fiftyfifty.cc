name: Daily Briefing Email

on:
  schedule:
    # 6:30 AM PDT (UTC-7) = 13:30 UTC — morning briefing
    - cron: "30 13 * * 1-5"
    # 6:00 PM PDT (UTC-7) = 01:00 UTC (next day) — end of day
    - cron: "0 1 * * 2-6"
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Send briefing
        env:
          NOTION_TOKEN:   ${{ secrets.NOTION_TOKEN }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          GCAL_ICAL_URL:  ${{ secrets.GCAL_ICAL_URL }}
          GMAIL_USER:     "letsgofiftyfifty@gmail.com"
        run: python scripts/daily_briefing.py
