name: Morning Task Feed

on:
  schedule:
    # 6:45 AM PDT (UTC-7) = 13:45 UTC | adjust to 12:45 UTC in winter (PST)
    - cron: "45 13 * * 1-5"
  workflow_dispatch:  # allow manual trigger from dashboard

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run task feed
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/notion_feed.py
