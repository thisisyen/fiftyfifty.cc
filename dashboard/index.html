<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiftyfifty</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="header-left">
      <h1 class="header-title">Fiftyfifty</h1>
      <div class="header-date" id="header-date"></div>
    </div>
    <div class="header-right">
      <span class="header-icon" title="Reset API key" onclick="resetApiKey()">☠</span>
      <span class="header-status" id="header-status">connecting…</span>
    </div>
  </header>

  <main class="panels">

    <section class="panel" id="panel-tasks">
      <div class="section-label">Tasks</div>
      <div id="task-groups"><div class="muted-text">Loading…</div></div>
    </section>

    <section class="panel" id="panel-relocation">
      <div class="section-label">Relocation</div>
      <div class="section-sub">Japan move · July 1, 2026</div>
      <div id="track-grid"><div class="muted-text">Loading…</div></div>
    </section>

    <section class="panel" id="panel-market">
      <div class="section-label">Markets</div>
      <div class="section-sub" id="market-updated"></div>
      <div id="market-rows"><div class="muted-text">Loading…</div></div>
    </section>

    <section class="panel" id="panel-actions">
      <div class="section-label">Actions</div>
      <div class="action-list">
        <div class="action-item">
          <div class="action-info">
            <div class="action-name">Morning Task Feed</div>
            <div class="action-desc">Pull today's relocation tasks into My tasks</div>
            <div class="run-status" id="status-morning-feed"></div>
          </div>
          <button class="btn" data-workflow="morning-feed">run</button>
        </div>
        <div class="action-item">
          <div class="action-info">
            <div class="action-name">Sync Back</div>
            <div class="action-desc">Mirror completed tasks to Relocation board</div>
            <div class="run-status" id="status-sync-back"></div>
          </div>
          <button class="btn" data-workflow="sync-back">run</button>
        </div>
        <div class="action-item">
          <div class="action-info">
            <div class="action-name">Daily Briefing</div>
            <div class="action-desc">Send morning email to yen.lai@icloud.com</div>
            <div class="run-status" id="status-daily-briefing"></div>
          </div>
          <button class="btn" data-workflow="daily-briefing">run</button>
        </div>
      </div>
    </section>

  </main>

</div>
<script src="assets/app.js"></script>
</body>
</html>
